x-go-build: &go-build
  context: .
  dockerfile: service/Dockerfile

x-go-environment: &go-environment
  PROJECT_NAME: ${PROJECT_NAME:-Hermes Platform}
  ENVIRONMENT: ${ENVIRONMENT:-local}
  FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
  POSTGRES_SERVER: ${POSTGRES_SERVER:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-app}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app-password}
  POSTGRES_DB: ${POSTGRES_DB:-app}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  SECRET_KEY: ${SECRET_KEY:-yqVeBt_e1CJeSWYel2DGOVJRxNZiTadofeIjmHE4jjw}
  SERVICE_PORT: ${SERVICE_PORT:-80}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4318}

services:
  frontend:
    build:
      context: ./web
      dockerfile: ../docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hermes-network
    restart: unless-stopped

  api:
    build: *go-build
    environment:
      <<: *go-environment
    command: ["api"]
    # 非 root 进程监听 80 需要 NET_BIND_SERVICE
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - hermes-network
    restart: unless-stopped

  worker:
    build: *go-build
    environment:
      <<: *go-environment
    command: ["worker"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hermes-network
    restart: unless-stopped

  scheduler:
    build: *go-build
    environment:
      <<: *go-environment
      AUTOMATION_DASHBOARD_REFRESH_SECONDS: "60"
    # 单实例约束：多副本会重复投递 refresh:all
    deploy:
      replicas: 1
    command: ["scheduler"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hermes-network
    restart: unless-stopped

  # 一次性迁移容器：应用全部迁移后退出（exit 0 表示成功）
  migrate:
    build: *go-build
    environment:
      <<: *go-environment
    command: ["migrate", "-cmd", "up"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hermes-network
    restart: "no"

  postgres:
    image: postgres:18
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hermes-network
    restart: unless-stopped

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - hermes-network
    restart: unless-stopped

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_EMAIL?Variable not set}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD?Variable not set}
      ZO_DATA_DIR: /data
      ZO_LOCAL_MODE: true
    volumes:
      - ./data/openobserve:/data
    ports:
      - "5080:5080"
    networks:
      - hermes-network
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command:
      - "--config=/etc/otel/config.yaml"
    environment:
      OPENOBSERVE_URL: ${OPENOBSERVE_URL:-http://openobserve:5080/api/default}
      OPENOBSERVE_AUTH: ${OPENOBSERVE_AUTH:?Variable not set}
      OPENOBSERVE_STREAM: ${OPENOBSERVE_STREAM:-default}
    volumes:
      - ./etc/otel/config.yaml:/etc/otel/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - openobserve
    networks:
      - hermes-network
    restart: unless-stopped

networks:
  hermes-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
