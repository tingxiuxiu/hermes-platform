services:
  frontend:
    build:
      context: ./web
      dockerfile: ../docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - hermes-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: service/Dockerfile
    env_file:
      - path: ./service/.env
        required: false
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Hermes Platform}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes123
      POSTGRES_DB: hermes
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:-admin@example.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-change-this-admin-password}
      AUTOMATION_SERVICE_TOKEN: ${AUTOMATION_SERVICE_TOKEN:-change-this-service-token}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8080:8080"
    command: >-
      sh -c "pdm run alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hermes-network
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: service/Dockerfile
    env_file:
      - path: ./service/.env
        required: false
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Hermes Platform}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes123
      POSTGRES_DB: hermes
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:-admin@example.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-change-this-admin-password}
      AUTOMATION_SERVICE_TOKEN: ${AUTOMATION_SERVICE_TOKEN:-change-this-service-token}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: pdm run celery-worker
    depends_on:
      - backend
    networks:
      - hermes-network
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: service/Dockerfile
    env_file:
      - path: ./service/.env
        required: false
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Hermes Platform}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes123
      POSTGRES_DB: hermes
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:-admin@example.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-change-this-admin-password}
      AUTOMATION_SERVICE_TOKEN: ${AUTOMATION_SERVICE_TOKEN:-change-this-service-token}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: pdm run celery-beat
    depends_on:
      - backend
    networks:
      - hermes-network
    restart: unless-stopped

  # ============================================================================
  # Go 服务（迁移后的后端）：api / worker / scheduler + migrate 一次性容器
  # ============================================================================

  api:
    build:
      context: ./go-service
      dockerfile: Dockerfile
    environment:
      HTTP_PORT: "8081"
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes123
      POSTGRES_DB: hermes
      POSTGRES_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      AUTOMATION_SERVICE_TOKEN: ${AUTOMATION_SERVICE_TOKEN:-change-this-service-token}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:-admin@example.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-change-this-admin-password}
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4318
    command: ["api"]
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hermes-network
    restart: unless-stopped

  worker:
    build:
      context: ./go-service
      dockerfile: Dockerfile
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes123
      POSTGRES_DB: hermes
      POSTGRES_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4318
    command: ["worker"]
    depends_on:
      - api
    networks:
      - hermes-network
    restart: unless-stopped

  scheduler:
    build:
      context: ./go-service
      dockerfile: Dockerfile
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes123
      POSTGRES_DB: hermes
      POSTGRES_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      AUTOMATION_DASHBOARD_REFRESH_SECONDS: "60"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4318
    # ⚠️ 单实例约束：scheduler 多副本会重复投递 refresh:all（见 docs/01-architecture.md §4）
    deploy:
      replicas: 1
    command: ["scheduler"]
    depends_on:
      - api
    networks:
      - hermes-network
    restart: unless-stopped

  # 一次性迁移容器：应用全部迁移后退出（exit 0 表示成功）
  migrate:
    build:
      context: ./go-service
      dockerfile: Dockerfile
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes123
      POSTGRES_DB: hermes
      POSTGRES_SSLMODE: disable
    command: ["migrate", "-cmd", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hermes-network
    restart: "no"

  postgres:
    image: postgres:18
    environment:
      - POSTGRES_USER=hermes
      - POSTGRES_PASSWORD=hermes123
      - POSTGRES_DB=hermes
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hermes-network
    restart: unless-stopped

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - hermes-network
    restart: unless-stopped

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_EMAIL?Variable not set}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD?Variable not set}
      ZO_DATA_DIR: /data
      # 单机模式
      ZO_LOCAL_MODE: true
    volumes:
      - ./data/openobserve:/data
    ports:
      - "5080:5080"
    networks:
      - hermes-network
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command:
      - "--config=/etc/otel/config.yaml"
    volumes:
      - ./etc/otel/config.yaml:/etc/otel/config.yaml
    ports:
      # OTLP grpc
      - "4317:4317"
      # OTLP http
      - "4318:4318"
      # metrics
      - "8889:8889"
    depends_on:
      - openobserve
    networks:
      - hermes-network
    restart: unless-stopped

networks:
  hermes-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
