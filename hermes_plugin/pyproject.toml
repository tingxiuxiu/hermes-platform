[project]
name = "hermes_plugin"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "xinzhang",email = "112859811@qq.com"},
]
dependencies = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pydantic>=2.13.4",
    "allure-pytest>=2.13",
]
requires-python = ">=3.14"
readme = "README.md"
license = {text = "MIT"}

[project.entry-points.pytest11]
hermes-plugin = "hermes_plugin.hermes_pytest"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true
