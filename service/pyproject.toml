[project]
name = "app"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "xinzhang",email = "112859811@qq.com"},
]
dependencies = ["fastapi[standard]>=0.139.2", "python-multipart>=0.0.32", "email-validator>=2.3.0", "pydantic>=2.13.4", "tenacity>=9.1.4", "alembic>=1.18.5", "httpx>=0.28.1", "psycopg[binary]>=3.3.4", "pydantic-settings>=2.14.2", "sqlalchemy>=2.0.51", "sentry-sdk[fastapi]>=2.66.0", "pyjwt>=2.13.0", "pwdlib[argon2,bcrypt]>=0.3.0", "emails>=1.1.2", "jinja2>=3.1.6", "opentelemetry-api>=1.44.0", "opentelemetry-sdk>=1.44.0", "opentelemetry-exporter-otlp>=1.44.0", "opentelemetry-instrumentation-fastapi>=0.65b0", "opentelemetry-instrumentation-sqlalchemy>=0.65b0", "opentelemetry-instrumentation-redis>=0.65b0", "opentelemetry-instrumentation-httpx>=0.65b0", "structlog>=26.1.0", "redis>=8.0.1"]
requires-python = ">=3.14"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.scripts]
dev.cmd = "python -m fastapi dev --port 8080 src/app/main.py"

[tool.pdm]
distribution = true

[[tool.pdm.source]]
name = "pypi"
url = "https://mirrors.huaweicloud.com/repository/pypi/simple"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=2.3.0",
    "ty>=0.0.61",
    "ruff>=0.15.22",
    "coverage>=7.15.2",
]
